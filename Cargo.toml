[package]
name = "qora"
description = "QORA text-only CPU inference engine"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "qora"
path = "src/main.rs"

[[bin]]
name = "convert"
path = "src/convert.rs"

[dependencies]
argh = "0.1"
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
half = "2.7"
# rayon = "1.12"
rayon = "1"
memmap2 = "0.9"
